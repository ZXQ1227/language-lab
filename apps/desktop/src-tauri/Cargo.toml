[package]
name = "language-lab"
version = "0.0.1"
description = "Local-first AI language learning desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "language_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "=0.3.2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
objc2-speech = "0.3.2"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSLocale", "NSURL", "NSString", "NSError", "NSArray"] }
objc2 = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
